# Deploys ONLY Firebase Hosting to floodcenter-backend-v2.
# Required secrets: FIREBASE_TOKEN (from `firebase login:ci`),
#   REACT_APP_FIREBASE_API_KEY, REACT_APP_GOOGLE_MAPS_API_KEY
# Required variables: REACT_APP_FIREBASE_MESSAGING_SENDER_ID, REACT_APP_FIREBASE_APP_ID
# Optional variables: FIREBASE_PROJECT_ID (default floodcenter-backend-v2),
#   REACT_APP_FIREBASE_MEASUREMENT_ID, REACT_APP_GOOGLE_MAPS_ID,
#   REACT_APP_DEFAULT_MAP_LAT, REACT_APP_DEFAULT_MAP_LNG, REACT_APP_REQUIRE_LOGIN

name: Deploy Hosting

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'floodcenter-backend-v2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Refuse production project
        run: |
          if [ "$PROJECT_ID" = "floodcenter-backend" ]; then
            echo "Refusing to deploy v2 hosting to production (floodcenter-backend)." >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        # Strip UTF-8 BOM from secrets/vars (PowerShell Set-Content often adds one).
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ env.PROJECT_ID }}.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ env.PROJECT_ID }}.firebasestorage.app
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
          REACT_APP_GOOGLE_MAPS_ID: ${{ vars.REACT_APP_GOOGLE_MAPS_ID }}
          REACT_APP_DEFAULT_MAP_LAT: ${{ vars.REACT_APP_DEFAULT_MAP_LAT }}
          REACT_APP_DEFAULT_MAP_LNG: ${{ vars.REACT_APP_DEFAULT_MAP_LNG }}
          REACT_APP_REQUIRE_LOGIN: ${{ vars.REACT_APP_REQUIRE_LOGIN || 'false' }}
        run: |
          strip() { printf '%s' "$1" | sed $'s/^\xEF\xBB\xBF//'; }
          export REACT_APP_FIREBASE_API_KEY="$(strip "$REACT_APP_FIREBASE_API_KEY")"
          export REACT_APP_GOOGLE_MAPS_API_KEY="$(strip "$REACT_APP_GOOGLE_MAPS_API_KEY")"
          export REACT_APP_GOOGLE_MAPS_ID="$(strip "$REACT_APP_GOOGLE_MAPS_ID")"
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy Hosting only
        run: firebase deploy --only hosting --project "${PROJECT_ID}" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
